<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beger Project Tracker – บันทึกงานโครงการ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2433;--mute:#6b7385;--line:#e3e7ee;--pri:#0b5cad;--pri2:#e8f1fb;--ok:#1f8a4c;--warn:#c27c0e;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
header .who{font-size:13px;opacity:.9}
header button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4)}
nav{display:flex;gap:4px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:none;background:none;padding:8px 14px;border-radius:8px;color:var(--mute);font-weight:600;white-space:nowrap}
nav button.on{background:var(--pri2);color:var(--pri)}
main{max-width:1150px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 12px}
button{font-family:inherit;font-size:14px;cursor:pointer;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:#fff;color:var(--ink)}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.sm{padding:4px 10px;font-size:13px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:64px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{font-size:13px;color:var(--mute)}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.kpi .s{font-size:12px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:13px;background:#fafbfc;position:sticky;top:0}
td.num,th.num{text-align:right;white-space:nowrap}
.tbl{overflow:auto;max-height:560px}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.bars .row{display:grid;grid-template-columns:130px 1fr 110px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bars .track{background:#eef1f5;border-radius:6px;height:18px;overflow:hidden}
.bars .fill{height:100%;background:var(--pri);border-radius:6px}
.bars .val{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters>*{width:auto;min-width:140px;flex:1}
.mute{color:var(--mute);font-size:13px}
.alert{border-left:4px solid var(--warn);background:#fff8ec}
.alert.bad{border-left-color:var(--bad);background:#fdf1ef}
.modal{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:14px;max-width:640px;width:100%;padding:18px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:30}
.login{max-width:420px;margin:50px auto}
.hist{font-size:13px;border-left:2px solid var(--line);padding-left:10px;margin:4px 0}
img.thumb{max-width:120px;max-height:90px;border-radius:6px;margin:4px 4px 0 0;border:1px solid var(--line)}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.invalid{border-color:var(--bad)!important;background:#fff5f4!important;box-shadow:0 0 0 3px rgba(192,57,43,.15);animation:shake .4s}
.errmsg{color:var(--bad);font-size:12px;margin-top:3px;font-weight:600}
label.req-bad{color:var(--bad)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media(max-width:600px){.bars .row{grid-template-columns:90px 1fr 80px}main{padding:10px}}
</style>
</head>

  <button class="sm" id="btnLogout" style="display:none">ออกจากระบบ</button>

/* ประหยัดโควตา Firebase:
   - PC: query เฉพาะโครงการของตัวเอง (where pcCode == ตัวเอง)
   - ทีม Sales: เก็บ cache ในเครื่อง แล้วดึงเฉพาะเอกสารที่ ts ใหม่กว่าครั้งล่าสุด
   - โหลดข้อมูลแค่ตอนล็อกอิน / กดรีเฟรช ไม่โหลดทุกครั้งที่สลับแท็บ
   - รูปแยกเก็บใน collection "photos" โหลดเฉพาะตอนเปิดดูโครงการ
   - ลบแบบ soft delete (deleted:true) เพื่อให้เครื่องอื่นรู้ว่าถูกลบ */
const Store = {
  mode:"local", db:null, cache:{last:0,items:{}}, key:STORE_KEY, PK:STORE_KEY+"_photos", synced:false, photoMem:{}, lastSyncAt:null, lastReads:0,
  async init(){
    if(FIREBASE_CONFIG){
      try{
        await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
        await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");
        firebase.initializeApp(FIREBASE_CONFIG);
        this.db = firebase.firestore(); this.mode="firebase"; return;
      }catch(e){ console.warn("Firebase ไม่พร้อม ใช้โหมดในเครื่อง", e); }
    }
    const c=lsGet(this.key);
    if(c&&c.items){ this.cache=c; }
    else { const items={}; seed().forEach(p=>items[p.id]=p); this.cache={last:0,items}; this.save(); }
  },
  save(){ lsSet(this.key,this.cache); },
  async sync(){
    if(this.mode!=="firebase"){ this.synced=true; this.lastSyncAt=new Date(); return; }
    const admin=user.role==="admin";
    this.key=STORE_KEY+"_cache_"+(admin?"all":user.code);
    let c=lsGet(this.key)||{last:0,items:{}};
    let q=this.db.collection("projects");
    if(admin){ if(c.last) q=q.where("ts",">",firebase.firestore.Timestamp.fromMillis(c.last)); }
    else { q=q.where("pcCode","==",user.code); c.items={}; }
    const s=await q.get();
    s.docs.forEach(d=>{const x=d.data(); const ms=x.ts&&x.ts.toMillis?x.ts.toMillis():0; x.ts=ms; x.id=d.id; c.items[d.id]=x; if(ms>c.last)c.last=ms;});
    this.cache=c; this.save(); this.synced=true; this.lastSyncAt=new Date(); this.lastReads=s.size;
  },
  list(){ return Object.values(this.cache.items||{}).filter(x=>!x.deleted); },
  async put(p){
    p.ts=Date.now();
    if(this.mode==="firebase"){ const {id,...rest}=p; rest.ts=firebase.firestore.FieldValue.serverTimestamp(); await this.db.collection("projects").doc(id).set(rest); }
    this.cache.items[p.id]=p; this.save();
  },
  async del(id){ const p=this.cache.items[id]; if(!p)return; await this.put(Object.assign({},p,{deleted:true})); },
  async putPhotos(id,arr){
    this.photoMem[id]=arr;
    if(this.mode==="firebase"){ await this.db.collection("photos").doc(id).set({arr}); return; }
    const m=lsGet(this.PK)||{}; m[id]=arr; if(!lsSet(this.PK,m)) toast("พื้นที่เก็บรูปในเครื่องเต็ม");
  },
  async getPhotos(id){
    if(this.photoMem[id]) return this.photoMem[id];

function markField(id,msg){
  const el=$(id); if(!el)return; const box=el.parentElement;
  const lb=box.querySelector("label"); const old=box.querySelector(".errmsg"); if(old)old.remove();
  el.classList.remove("invalid"); if(lb)lb.classList.remove("req-bad");
  if(!msg)return;
  void el.offsetWidth; el.classList.add("invalid"); if(lb)lb.classList.add("req-bad");
  const m=document.createElement("div"); m.className="errmsg"; m.textContent="⚠️ "+msg; box.appendChild(m);
  const clear=()=>{ if(el.value&&el.value.trim()){markField(id,null);el.removeEventListener("input",clear);el.removeEventListener("change",clear);} };
  el.addEventListener("input",clear); el.addEventListener("change",clear);
}
function shrink(file){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.6));};im.src=r.result;};r.readAsDataURL(file);});}

  ${rows.map(p=>`<tr style="cursor:pointer" data-id="${p.id}"><td><b>${esc(p.name)}</b><div class="mute">${esc(p.type)} · ${esc(p.contact)}</div></td>
  <td>${esc(p.chain)}<div class="mute">${esc(p.branch)}</div></td>${user.role==="admin"?`<td>${esc(p.pcName)}</td>`:""}
  <td class="num">${fmt(p.value)}</td><td>${thDate(p.expectDate)}</td><td>${badge(p.status)}</td><td class="mute">${daysBetween(p.updatedAt,today())} วันก่อน</td></tr>`).join("")||`<tr><td colspan="7" class="mute">ไม่พบข้อมูล</td></tr>`}
  </tbody></table></div>`;
  document.querySelectorAll("#listBody tr[data-id]").forEach(tr=>tr.onclick=()=>showDetail(tr.dataset.id));
}
function showDetail(id){
  const p=data.find(x=>x.id===id); if(!p)return;
  const canEdit=user.role==="admin"||p.pcCode===user.code;
  const idx=STATUSES.findIndex(s=>s.k===p.status);
  const next=STATUSES[idx+1]&&idx<4?STATUSES[idx+1].k:null;
  openModal(`<div class="flex"><h2 style="margin:0;flex:1">${esc(p.name)}</h2><button class="sm" onclick="closeModal()">✕</button></div>
  <p>${badge(p.status)} ${p.lostReason?`<span class="mute">เหตุผล: ${esc(p.lostReason)}</span>`:""}</p>
  <table>
   <tr><td class="mute">ห้าง / สาขา</td><td>${esc(p.chain)} · ${esc(p.branch)}</td></tr>
   <tr><td class="mute">ประเภท</td><td>${esc(p.type)||"-"}</td></tr>
   <tr><td class="mute">ผู้ติดต่อ</td><td>${esc(p.contact)||"-"} ${p.phone?`· <a href="tel:${esc(p.phone)}">${esc(p.phone)}</a>`:""}</td></tr>
   <tr><td class="mute">สินค้า</td><td>${(p.products||[]).map(esc).join(", ")||"-"}<div class="mute">${esc(p.qty)}</div></td></tr>
   <tr><td class="mute">มูลค่า</td><td><b>${fmt(p.value)} บาท</b></td></tr>
   <tr><td class="mute">คาดสั่งซื้อ</td><td>${thDate(p.expectDate)}</td></tr>
   <tr><td class="mute">คู่แข่ง</td><td>${esc(p.competitor)||"-"}</td></tr>
   <tr><td class="mute">หมายเหตุ</td><td>${esc(p.note)||"-"}</td></tr>
   <tr><td class="mute">PC ผู้บันทึก</td><td>${esc(p.pcName)} · ${thDate(p.createdAt)}</td></tr>
   <tr><td class="mute">ซุปที่ดูแล</td><td>${esc(p.sup)||"-"} ${supOf(p.chain,p.branch).t?`<span class="mute">(${esc(supOf(p.chain,p.branch).t)})</span>`:""}</td></tr>
  </table>
  <div id="dPh">${p.photoCount?'<span class="mute">กำลังโหลดรูป...</span>':""}</div>
  ${canEdit?`<div class="flex" style="margin:14px 0">${next?`<button class="pri" id="dNext">➡️ เลื่อนเป็น "${next}"</button>`:""}<button id="dLost">❌ แพ้/ยกเลิก</button><button id="dEdit">✏️ แก้ไข</button><button id="dDel" class="right" style="color:#c0392b">ลบ</button></div>`:""}
  <h2 style="margin-top:14px">💬 ความคิดเห็น / ขอ support</h2>
  ${(p.comments||[]).map(c=>`<div class="hist"><b>${esc(c.by)}</b> <span class="mute">${thDate(c.at)}</span><br>${esc(c.text)}</div>`).join("")||`<p class="mute">ยังไม่มีความคิดเห็น</p>`}
  <div class="flex"><input id="dCm" placeholder="พิมพ์ข้อความ เช่น ส่งใบเสนอราคาแล้ว" style="flex:1"><button id="dCmGo">ส่ง</button></div>
  <h2 style="margin-top:14px">🕑 ประวัติสถานะ</h2>
  ${(p.history||[]).slice().reverse().map(h=>`<div class="hist">${thDate(h.at)} · ${badge(h.status)} <span class="mute">โดย ${esc(h.by)}</span></div>`).join("")}`);
  if(p.photoCount) Store.getPhotos(p.id).then(a=>{const d=$("#dPh");if(d)d.innerHTML=a.map(s=>`<img class="thumb" src="${s}">`).join("");}).catch(()=>{});
  const upd=async(ch,msg)=>{Object.assign(p,ch,{updatedAt:today()});try{await Store.put(p);}catch(e){return toast("บันทึกไม่สำเร็จ");}toast(msg);closeModal();boot();};
  if(canEdit){
    if(next)$("#dNext").onclick=()=>upd({status:next,history:p.history.concat([{at:today(),status:next,by:user.name}])},"อัปเดตสถานะแล้ว");
    $("#dLost").onclick=()=>{
      $("#dLost").outerHTML=`<select id="dLr" style="width:auto">${LOST_REASONS.map(r=>`<option>${r}</option>`).join("")}</select><button id="dLrGo">ยืนยัน</button>`;
      $("#dLrGo").onclick=()=>upd({status:"แพ้/ยกเลิก",lostReason:$("#dLr").value,history:p.history.concat([{at:today(),status:"แพ้/ยกเลิก",by:user.name}])},"บันทึกแล้ว");
    };
    $("#dEdit").onclick=()=>{closeModal();view="form";$("#nav").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v==="form"));renderForm(p);};
    $("#dDel").onclick=()=>{ if($("#dDel").dataset.c){Store.del(p.id).then(()=>{toast("ลบแล้ว");closeModal();boot();});} else {$("#dDel").dataset.c=1;$("#dDel").textContent="กดอีกครั้งเพื่อยืนยันลบ";} };
  }
  $("#dCmGo").onclick=()=>{const t=$("#dCm").value.trim();if(!t)return;upd({comments:(p.comments||[]).concat([{at:today(),by:user.name,text:t}])},"ส่งความคิดเห็นแล้ว");};
}

/* ================= Follow-up ================= */
function followList(){
  const t=today();
  return mine().filter(p=>OPEN.includes(p.status)).map(p=>{
    const r=[]; const stale=daysBetween(p.updatedAt,t), dTo=daysBetween(t,p.expectDate);
    if(dTo<0)r.push({lv:"bad",t:`เลยวันคาดสั่งซื้อมา ${-dTo} วัน`});
    else if(dTo<=SOON_DAYS)r.push({lv:"warn",t:`อีก ${dTo} วันถึงวันคาดสั่งซื้อ`});
    if(stale>STALE_DAYS)r.push({lv:"warn",t:`ไม่มีการอัปเดต ${stale} วัน`});
    return {p,r,score:(dTo<0?100:0)+stale+(dTo<=SOON_DAYS?30:0)};
  }).filter(x=>x.r.length).sort((a,b)=>b.score-a.score);
}
function renderFollow(){
  const L=followList();
  $("#app").innerHTML=`<div class="card"><h2>⏰ โครงการที่ต้องตามด่วน (${L.length})</h2>
  <p class="mute">เงื่อนไข: ใกล้วันคาดสั่งซื้อภายใน ${SOON_DAYS} วัน, เลยวันคาดสั่งซื้อแล้ว หรือไม่อัปเดตเกิน ${STALE_DAYS} วัน</p></div>
  ${L.map(({p,r})=>`<div class="card ${r.some(x=>x.lv==="bad")?"alert bad":"alert"}" style="cursor:pointer" data-id="${p.id}">
    <div class="flex"><b>${esc(p.name)}</b> ${badge(p.status)}<span class="right"><b>${fmt(p.value)}</b> บาท</span></div>
    <div class="mute">${esc(p.chain)} · ${esc(p.branch)} · ${esc(p.pcName)} · ${esc(p.contact)} ${esc(p.phone)}</div>
    <div style="margin-top:6px">${r.map(x=>`⚠️ ${x.t}`).join(" &nbsp; ")}</div></div>`).join("")||`<div class="card mute">ไม่มีโครงการค้าง 🎉</div>`}`;
  document.querySelectorAll(".card[data-id]").forEach(c=>c.onclick=()=>showDetail(c.dataset.id));
}

/* ================= Dashboard ================= */
function bars(items,fmtv){const mx=Math.max(1,...items.map(i=>i.v));return `<div class="bars">${items.map(i=>`<div class="row"><span>${i.l}</span><div class="track"><div class="fill" style="width:${i.v/mx*100}%;background:${i.c||"var(--pri)"}"></div></div><span class="val">${fmtv?fmtv(i.v):fmt(i.v)}</span></div>`).join("")||'<p class="mute">ไม่มีข้อมูล</p>'}</div>`;}
function renderDash(){
  const D=mine();
  const open=D.filter(p=>OPEN.includes(p.status)), won=D.filter(p=>WON.includes(p.status)), lost=D.filter(p=>p.status==="แพ้/ยกเลิก");
  const sum=a=>a.reduce((s,p)=>s+(+p.value||0),0);
  const weighted=open.reduce((s,p)=>s+(+p.value||0)*st(p.status).w,0);
  const winRate=(won.length+lost.length)?won.length/(won.length+lost.length)*100:0;
  // by status
  const byStatus=STATUSES.map(s=>({l:s.k,v:sum(D.filter(p=>p.status===s.k)),c:s.c,n:D.filter(p=>p.status===s.k).length}));
  // by chain (open pipeline)
  const byChain=Object.keys(CHAINS).map(c=>({l:c,v:sum(open.filter(p=>p.chain===c))})).filter(x=>x.v).sort((a,b)=>b.v-a.v);
  // forecast next 6 months (weighted, open + won not yet delivered)
  const months=[];const d0=new Date();d0.setDate(1);
  for(let i=-1;i<6;i++){const d=new Date(d0);d.setMonth(d.getMonth()+i);months.push(d.toISOString().slice(0,7));}
  const fc=months.map(m=>{const ps=D.filter(p=>(p.expectDate||"").slice(0,7)===m&&!["แพ้/ยกเลิก"].includes(p.status));
    return {l:thMonth(m),v:ps.reduce((s,p)=>s+(+p.value||0)*st(p.status).w,0),full:sum(ps)};});
  // by PC
  const pcMap={};D.forEach(p=>{const k=p.pcCode;pcMap[k]=pcMap[k]||{name:p.pcName,code:p.branch,n:0,open:0,won:0,wonV:0,last:""};
    const o=pcMap[k];o.n++;if(OPEN.includes(p.status))o.open+=+p.value||0;if(WON.includes(p.status)){o.won++;o.wonV+=+p.value||0;}if(p.updatedAt>o.last)o.last=p.updatedAt;});
  const pcs=Object.values(pcMap).sort((a,b)=>b.open-a.open);
  const supMap={};D.forEach(p=>{const k=p.sup||"ไม่ระบุซุป";supMap[k]=supMap[k]||{n:0,open:0,wonV:0,pcs:new Set()};const o=supMap[k];o.n++;o.pcs.add(p.pcCode);if(OPEN.includes(p.status))o.open+=+p.value||0;if(WON.includes(p.status))o.wonV+=+p.value||0;});
  const totalPC=Object.values(MASTER).reduce((a,c)=>a+Object.values(c).reduce((x,b)=>x+b.p.length,0),0);
  const activePC=new Set(D.map(p=>p.pcCode)).size;
  // lost reasons
  const lr={};lost.forEach(p=>lr[p.lostReason||"ไม่ระบุ"]=(lr[p.lostReason||"ไม่ระบุ"]||0)+1);
  const comp={};D.forEach(p=>{const c=(p.competitor||"").split(/[ ,]/)[0];if(c)comp[c]=(comp[c]||0)+1;});

  $("#app").innerHTML=`
  <div class="kpis">
    <div class="kpi"><div class="l">Pipeline ที่ยังเปิด</div><div class="v">${fmtM(sum(open))}</div><div class="s">${open.length} โครงการ</div></div>
    <div class="kpi"><div class="l">Forecast ถ่วงน้ำหนัก</div><div class="v">${fmtM(weighted)}</div><div class="s">มูลค่า × โอกาสตามสถานะ</div></div>
    <div class="kpi"><div class="l">ปิดการขายได้</div><div class="v" style="color:var(--ok)">${fmtM(sum(won))}</div><div class="s">${won.length} โครงการ</div></div>
    <div class="kpi"><div class="l">Win rate</div><div class="v">${winRate.toFixed(0)}%</div><div class="s">ชนะ ${won.length} / แพ้ ${lost.length}</div></div>
    ${user.role==="admin"?`<div class="kpi"><div class="l">PC ที่ส่งข้อมูลแล้ว</div><div class="v">${activePC}<span style="font-size:15px;color:var(--mute)"> / ${fmt(totalPC)}</span></div><div class="s">${(activePC/totalPC*100).toFixed(1)}% ของ PC ทั้งหมด</div></div>`:""}
    <div class="kpi"><div class="l">ต้องตามด่วน</div><div class="v" style="color:var(--bad)">${followList().length}</div><div class="s">โครงการ</div></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px">
    <div class="card"><h2>Pipeline ตามสถานะ (บาท)</h2>${bars(byStatus.map(s=>({...s,l:`${s.l} (${s.n})`})))}</div>
    <div class="card"><h2>Forecast รายเดือน (ถ่วงน้ำหนัก)</h2>${bars(fc)}<p class="mute">น้ำหนัก: ${STATUSES.filter(s=>s.w).map(s=>`${s.k} ${s.w*100}%`).join(" · ")}</p></div>
    <div class="card"><h2>Pipeline เปิดอยู่ แยกห้าง</h2>${bars(byChain)}</div>
    <div class="card"><h2>เหตุผลที่แพ้ / คู่แข่งที่เจอ</h2>${bars(Object.entries(lr).map(([l,v])=>({l,v,c:"#c0392b"})),v=>v+" ครั้ง")}<hr style="border:none;border-top:1px solid var(--line)">${bars(Object.entries(comp).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v,c:"#8a5a00"})),v=>v+" โครงการ")}</div>
  </div>
  ${user.role==="admin"?`<div class="card"><h2>สรุปราย PC</h2><div class="tbl"><table><thead><tr><th>PC</th><th class="num">โครงการทั้งหมด</th><th class="num">Pipeline เปิด</th><th class="num">ปิดได้</th><th class="num">มูลค่าปิดได้</th><th>อัปเดตล่าสุด</th></tr></thead><tbody>
  ${pcs.map(o=>`<tr><td>${esc(o.name)} <span class="mute">${esc(o.code)}</span></td><td class="num">${o.n}</td><td class="num">${fmt(o.open)}</td><td class="num">${o.won}</td><td class="num">${fmt(o.wonV)}</td><td class="${daysBetween(o.last,today())>STALE_DAYS?"":"mute"}" style="${daysBetween(o.last,today())>STALE_DAYS?"color:#c0392b":""}">${daysBetween(o.last,today())} วันก่อน</td></tr>`).join("")}
  </tbody></table></div></div>
  <div class="card"><h2>สรุปรายซุป</h2><div class="tbl"><table><thead><tr><th>ซุป</th><th class="num">PC ที่ส่งข้อมูล</th><th class="num">โครงการ</th><th class="num">Pipeline เปิด</th><th class="num">มูลค่าปิดได้</th></tr></thead><tbody>
  ${Object.entries(supMap).sort((a,b)=>b[1].open-a[1].open).map(([s,o])=>`<tr><td>${esc(s)}</td><td class="num">${o.pcs.size}</td><td class="num">${o.n}</td><td class="num">${fmt(o.open)}</td><td class="num">${fmt(o.wonV)}</td></tr>`).join("")}
  </tbody></table></div></div>
  ${data.some(p=>p.demo)?`<div class="card"><div class="flex"><span class="mute">มีข้อมูลตัวอย่าง ${data.filter(p=>p.demo).length} รายการ (ชื่อลงท้าย "ตัวอย่าง")</span><button class="sm right" id="clrDemo" style="color:#c0392b">ลบข้อมูลตัวอย่าง</button></div></div>`:""}`:""}`;
  const cd=$("#clrDemo"); if(cd)cd.onclick=async()=>{ if(!cd.dataset.c){cd.dataset.c=1;cd.textContent="กดอีกครั้งเพื่อยืนยัน";return;}
    for(const p of data.filter(x=>x.demo)) await Store.del(p.id); toast("ลบข้อมูลตัวอย่างแล้ว"); boot(); };
}

/* ================= Export ================= */
function exportXls(){
  const rows=filtered().map(p=>({"วันที่บันทึก":p.createdAt,"อัปเดตล่าสุด":p.updatedAt,"ชื่อ PC":p.pcName,"ซุปที่ดูแล":p.sup||"","ห้าง":p.chain,"สาขา":p.branch,
    "ชื่อโครงการ":p.name,"ประเภท":p.type,"ผู้ติดต่อ":p.contact,"เบอร์":p.phone,"สินค้า":(p.products||[]).join(", "),"ปริมาณ":p.qty,
    "มูลค่า (บาท)":+p.value||0,"วันคาดสั่งซื้อ":p.expectDate,"สถานะ":p.status,"โอกาส %":st(p.status).w*100,"มูลค่าถ่วงน้ำหนัก":(+p.value||0)*st(p.status).w,
    "เหตุผลแพ้":p.lostReason,"คู่แข่ง":p.competitor,"หมายเหตุ":p.note}));
  if(typeof XLSX==="undefined")return toast("โหลดตัว Export ไม่สำเร็จ");
  try{
    const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Projects");
    XLSX.writeFile(wb,`Beger_Projects_${today()}.xlsx`);toast("ดาวน์โหลด Excel แล้ว");
  }catch(e){ // บางหน้าจอ (เช่น preview) บล็อกการดาวน์โหลด → คัดลอกเป็นตารางแทน
    const tsv=[Object.keys(rows[0]||{}).join("\t")].concat(rows.map(r=>Object.values(r).join("\t"))).join("\n");
    navigator.clipboard.writeText(tsv).then(()=>toast("ดาวน์โหลดไม่ได้ในหน้านี้ → คัดลอกตารางแล้ว วางใน Excel ได้เลย"),()=>toast("ดาวน์โหลดไม่ได้ในหน้านี้"));
  }
}

Store.init().then(boot);
</script>
