.brand .mark{background:var(--red);color:#fff;font-weight:700;font-size:17px;letter-spacing:.5px;padding:3px 11px;border-radius:8px;box-shadow:0 2px 8px rgba(237,27,36,.4)}
.brand h1{font-size:17px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1 small{display:block;font-size:12px;font-weight:300;opacity:.85}
header .who{font-size:13px;background:rgba(255,255,255,.14);padding:5px 12px;border-radius:20px}
header button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35)}
header button:hover{background:rgba(255,255,255,.22)}
/* ---------- Nav ---------- */
nav{position:sticky;top:61px;z-index:14;display:flex;gap:6px;padding:10px 20px;background:rgba(243,246,251,.92);backdrop-filter:blur(10px);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:1px solid transparent;background:#fff;padding:8px 16px;border-radius:999px;color:var(--mute);font-weight:500;white-space:nowrap;box-shadow:0 1px 2px rgba(16,35,70,.06);transition:.15s}
nav button:hover{color:var(--blue)}
nav button.on{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(46,49,146,.3)}
nav button.on .mute{color:rgba(255,255,255,.8)!important}
nav button{position:relative;display:inline-flex;align-items:center;gap:6px}
nav .ts{display:none}
nav .nb{background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:600;padding:1px 7px;line-height:1.5}
main{max-width:1180px;margin:0 auto;padding:18px 20px 40px}
/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.card h2{font-size:16px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--red)}
.flex h2::before{display:none}
/* ---------- Controls ---------- */
button{font-family:inherit;font-size:14px;cursor:pointer;border-radius:10px;padding:9px 16px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:500;transition:.15s}
button:hover{border-color:#c9d3e3}
button:active{transform:scale(.98)}
button:disabled{opacity:.6;cursor:wait}
button.pri{background:linear-gradient(135deg,var(--red) 0%,#F2545B 100%);color:#fff;border:none;box-shadow:0 4px 14px rgba(237,27,36,.3)}
button.pri:hover{background:linear-gradient(135deg,var(--red-d) 0%,var(--red) 100%)}

/* ================= Storage layer ================= */
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}};
/* ประหยัดโควตา Firebase:
   - PC: query เฉพาะโครงการของตัวเอง (where pcCode == ตัวเอง)
   - ทีม Sales: เก็บ cache ในเครื่อง แล้วดึงเฉพาะเอกสารที่ ts ใหม่กว่าครั้งล่าสุด
   - โหลดข้อมูลแค่ตอนล็อกอิน / กดรีเฟรช ไม่โหลดทุกครั้งที่สลับแท็บ
   - รูปแยกเก็บใน collection "photos" โหลดเฉพาะตอนเปิดดูโครงการ
   - ลบแบบ soft delete (deleted:true) เพื่อให้เครื่องอื่นรู้ว่าถูกลบ */
const Store = {
  mode:"local", db:null, cache:{last:0,items:{}}, key:STORE_KEY, PK:STORE_KEY+"_photos", synced:false, photoMem:{}, lastSyncAt:null, lastReads:0,
  async init(){
    if(FIREBASE_CONFIG){
      try{
        await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
        await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");
        firebase.initializeApp(FIREBASE_CONFIG);
        this.db = firebase.firestore(); this.mode="firebase"; return;
      }catch(e){ console.warn("Firebase ไม่พร้อม ใช้โหมดในเครื่อง", e); }
    }
    const c=lsGet(this.key);
    if(c&&c.items){ this.cache=c; }
    else { const items={}; seed().forEach(p=>items[p.id]=p); this.cache={last:0,items}; this.save(); }
  },
  save(){ lsSet(this.key,this.cache); },
  async sync(){
    if(this.mode!=="firebase"){ this.synced=true; this.lastSyncAt=new Date(); return; }
    const admin=user.role==="admin";
    this.key=STORE_KEY+"_cache_"+(admin?"all":user.code);
    let c=lsGet(this.key)||{last:0,items:{}};
    let q=this.db.collection("projects");
    if(admin){ if(c.last) q=q.where("ts",">",firebase.firestore.Timestamp.fromMillis(c.last)); }
    else { q=q.where("pcCode","==",user.code); c.items={}; }
    const s=await q.get();
    s.docs.forEach(d=>{const x=d.data(); const ms=x.ts&&x.ts.toMillis?x.ts.toMillis():0; x.ts=ms; x.id=d.id; c.items[d.id]=x; if(ms>c.last)c.last=ms;});
    this.cache=c; this.save(); this.synced=true; this.lastSyncAt=new Date(); this.lastReads=s.size;
  },
  list(){ return Object.values(this.cache.items||{}).filter(x=>!x.deleted); },
  async put(p){
    p.ts=Date.now();
    if(this.mode==="firebase"){ const {id,...rest}=p; rest.ts=firebase.firestore.FieldValue.serverTimestamp(); await this.db.collection("projects").doc(id).set(rest); }
    this.cache.items[p.id]=p; this.save();
  },
  async del(id){ const p=this.cache.items[id]; if(!p)return; await this.put(Object.assign({},p,{deleted:true})); },
  async putPhotos(id,arr){
    this.photoMem[id]=arr;
    if(this.mode==="firebase"){ await this.db.collection("photos").doc(id).set({arr}); return; }
    const m=lsGet(this.PK)||{}; m[id]=arr; if(!lsSet(this.PK,m)) toast("พื้นที่เก็บรูปในเครื่องเต็ม");
  },
  async getPhotos(id){
    if(this.photoMem[id]) return this.photoMem[id];
    let arr=[];
    if(this.mode==="firebase"){ const d=await this.db.collection("photos").doc(id).get(); arr=d.exists?(d.data().arr||[]):[]; }
    else { arr=(lsGet(this.PK)||{})[id]||[]; }
    return this.photoMem[id]=arr;
  }
};
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}

      products:[PRODUCTS[i%8],PRODUCTS[(i+3)%8]],qty:["200 แกลลอน","50 ถัง","120 แกลลอน + กันซึม 30 ถัง"][i%3],
      value:[85000,420000,150000,980000,60000,230000,35000,310000,540000,120000,760000,95000][i],
      expectDate:addDays(t,[-3,10,5,20,25,-10,40,8,-1,30,12,55][i]),status,lostReason:status==="แพ้/ยกเลิก"?"ราคาสูงกว่าคู่แข่ง":"",
      competitor:["TOA","Jotun","Nippon",""][i%4],note:"ข้อมูลตัวอย่างสำหรับทดลองระบบ",photos:[],comments:[],

  });
  return out;
}

function markField(id,msg){
  const el=$(id); if(!el)return; let box=el.parentElement; if(box.classList.contains("money")) box=box.parentElement;
  const lb=box.querySelector("label"); const old=box.querySelector(".errmsg"); if(old)old.remove();
  el.classList.remove("invalid"); if(lb)lb.classList.remove("req-bad");
  if(!msg)return;
  void el.offsetWidth; el.classList.add("invalid"); if(lb)lb.classList.add("req-bad");
  const m=document.createElement("div"); m.className="errmsg"; m.textContent="⚠️ "+msg; box.appendChild(m);
  const clear=()=>{ if(el.value&&el.value.trim()){markField(id,null);el.removeEventListener("input",clear);el.removeEventListener("change",clear);} };
  el.addEventListener("input",clear); el.addEventListener("change",clear);
}
function shrink(file){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.6));};im.src=r.result;};r.readAsDataURL(file);});}

/* ================= Follow-up ================= */
function followList(){
  const t=today();
  return mine().filter(p=>OPEN.includes(p.status)).map(p=>{
    const r=[]; const stale=daysBetween(p.updatedAt,t), dTo=daysBetween(t,p.expectDate);
    if(dTo<0)r.push({lv:"bad",t:`เลยวันคาดสั่งซื้อมา ${-dTo} วัน`});
    else if(dTo<=SOON_DAYS)r.push({lv:"warn",t:`อีก ${dTo} วันถึงวันคาดสั่งซื้อ`});
    if(stale>STALE_DAYS)r.push({lv:"warn",t:`ไม่มีการอัปเดต ${stale} วัน`});
    return {p,r,score:(dTo<0?100:0)+stale+(dTo<=SOON_DAYS?30:0)};
  }).filter(x=>x.r.length).sort((a,b)=>b.score-a.score);
}

  const L=followList();

  ${pcs.map(o=>`<tr><td>${esc(o.name)} <span class="mute">${esc(o.code)}</span></td><td class="num">${o.n}</td><td class="num">${fmt(o.open)}</td><td class="num">${o.won}</td><td class="num">${fmt(o.wonV)}</td><td class="${daysBetween(o.last,today())>STALE_DAYS?"":"mute"}" style="${daysBetween(o.last,today())>STALE_DAYS?"color:#c0392b":""}">${daysBetween(o.last,today())} วันก่อน</td></tr>`).join("")}
  </tbody></table></div></div>
  <div class="card"><h2>สรุปรายซุป</h2><div class="tbl"><table><thead><tr><th>ซุป</th><th class="num">PC ที่ส่งข้อมูล</th><th class="num">โครงการ</th><th class="num">Pipeline เปิด</th><th class="num">มูลค่าปิดได้</th></tr></thead><tbody>
  ${Object.entries(supMap).sort((a,b)=>b[1].open-a[1].open).map(([s,o])=>`<tr><td>${esc(s)}</td><td class="num">${o.pcs.size}</td><td class="num">${o.n}</td><td class="num">${fmt(o.open)}</td><td class="num">${fmt(o.wonV)}</td></tr>`).join("")}
  </tbody></table></div></div>
  ${data.some(p=>p.demo)?`<div class="card"><div class="flex"><span class="mute">มีข้อมูลตัวอย่าง ${data.filter(p=>p.demo).length} รายการ (ชื่อลงท้าย "ตัวอย่าง")</span><button class="sm right" id="clrDemo" style="color:#c0392b">ลบข้อมูลตัวอย่าง</button></div></div>`:""}`:""}`;
  const cd=$("#clrDemo"); if(cd)cd.onclick=async()=>{ if(!cd.dataset.c){cd.dataset.c=1;cd.textContent="กดอีกครั้งเพื่อยืนยัน";return;}
    for(const p of data.filter(x=>x.demo)) await Store.del(p.id); toast("ลบข้อมูลตัวอย่างแล้ว"); boot(); };
}

/* ================= Export ================= */
function exportXls(){
  const rows=filtered().map(p=>({"วันที่บันทึก":p.createdAt,"อัปเดตล่าสุด":p.updatedAt,"ชื่อ PC":p.pcName,"ซุปที่ดูแล":p.sup||"","ห้าง":p.chain,"สาขา":p.branch,
    "ชื่อโครงการ":p.name,"ประเภท":p.type,"ผู้ติดต่อ":p.contact,"เบอร์":p.phone,"สินค้า":(p.products||[]).join(", "),"ปริมาณ":p.qty,
    "มูลค่า (บาท)":+p.value||0,"วันคาดสั่งซื้อ":p.expectDate,"สถานะ":p.status,"โอกาส %":st(p.status).w*100,"มูลค่าถ่วงน้ำหนัก":(+p.value||0)*st(p.status).w,
    "เหตุผลแพ้":p.lostReason,"คู่แข่ง":p.competitor,"หมายเหตุ":p.note}));
  if(typeof XLSX==="undefined")return toast("โหลดตัว Export ไม่สำเร็จ");
  try{
    const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Projects");
    XLSX.writeFile(wb,`Beger_Projects_${today()}.xlsx`);toast("ดาวน์โหลด Excel แล้ว");
  }catch(e){ // บางหน้าจอ (เช่น preview) บล็อกการดาวน์โหลด → คัดลอกเป็นตารางแทน
    const tsv=[Object.keys(rows[0]||{}).join("\t")].concat(rows.map(r=>Object.values(r).join("\t"))).join("\n");
    navigator.clipboard.writeText(tsv).then(()=>toast("ดาวน์โหลดไม่ได้ในหน้านี้ → คัดลอกตารางแล้ว วางใน Excel ได้เลย"),()=>toast("ดาวน์โหลดไม่ได้ในหน้านี้"));
  }
}

Store.init().then(boot);
</script>
